<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Startline Labs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A0E12;color:#F2F5F8;
    font-family:"Chivo","Helvetica Neue",Arial,sans-serif;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .box{max-width:30em;text-align:center}
  .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#F2AE4B}
  h1{font-weight:900;font-size:clamp(30px,7vw,52px);letter-spacing:-.025em;margin:18px 0 0;line-height:1.05}
  p{color:#8B97A3;margin:18px 0 0;font-size:17px}
  a{display:inline-block;margin-top:30px;font-family:"IBM Plex Mono",monospace;font-size:13px;
    background:#F2AE4B;color:#0A0E12;padding:13px 22px;border-radius:9px;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <span class="lab">Error 404</span>
    <h1>That page isn't here.</h1>
    <p>The link may be old, or the address mistyped. Everything lives on the one page.</p>
    <a href="/">Back to the start line</a>
  </div>
</body>
</html>
